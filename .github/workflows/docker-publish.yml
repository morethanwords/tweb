name: Docker publish
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked revision to GHCR
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Serialize aliases and immutable SHA creation across concurrent releases/reruns.
concurrency:
  group: ghcr-telegram-web-k
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: checks
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Corresponding source including pinned submodules
        run: node deploy/source-archive.cjs source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-${{ github.sha }}
          path: source.tar.gz
          retention-days: 90
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image coordinates
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "name=ghcr.io/${OWNER,,}/telegram-web-k" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.image.outputs.sha }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-only
      - name: Preserve existing immutable SHA tag
        id: existing
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$TAG" > /tmp/manifest.txt 2>/tmp/manifest.err; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "digest=$(awk '/^Digest:/ {print $2; exit}' /tmp/manifest.txt)" >> "$GITHUB_OUTPUT"
          elif grep -Eq 'not found|manifest unknown|NAME_UNKNOWN|MANIFEST_UNKNOWN' /tmp/manifest.err; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat /tmp/manifest.err >&2
            exit 1
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.existing.outputs.exists == 'false'
        id: build
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            API_ID=${{ vars.API_ID }}
            API_HASH=${{ vars.API_HASH }}
          cache-from: type=gha,scope=tweb
          cache-to: type=gha,mode=max,scope=tweb
          sbom: true
          provenance: mode=max
      - name: Alias a previously published SHA without rebuilding it
        if: steps.existing.outputs.exists == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.existing.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          SHA_TAG: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
        run: |
          while IFS= read -r tag; do
            if test "$tag" != "$SHA_TAG"; then
              docker buildx imagetools create --tag "$tag" "$IMAGE@$DIGEST"
            fi
          done <<< "$TAGS"
      - name: Published digest and source obligation
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest || steps.existing.outputs.digest }}
        run: |
          echo "Published: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Distribute the corresponding source archive with this exact revision (docs/deployment.md).' >> "$GITHUB_STEP_SUMMARY"
