name: Docker Image Build CI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read version from .env
        id: env
        run: echo "PRODUCTION_BUILD_VERSION=$(grep ^PRODUCTION_BUILD_VERSION= .env | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./.docker/Dockerfile_production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.env.outputs.PRODUCTION_BUILD_VERSION }}

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from .env
        id: env
        run: echo "PRODUCTION_BUILD_VERSION=$(grep ^PRODUCTION_BUILD_VERSION= .env | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      - name: Pull latest image
        run: docker pull ghcr.io/${{ github.repository }}:latest

      - name: Pull versioned image
        run: |
          version=${{ steps.env.outputs.PRODUCTION_BUILD_VERSION }}
          docker pull ghcr.io/${{ github.repository }}:${version}
