<!-- Renderer exhaustion: nine custom properties, each referring to the one before ten times. Under 1 KB of CSS
     that substitutes to 10^9 tokens: a renderer that expands var() without a size limit runs out of memory (twidget
     before 8c6d311 grew past 1.5 GB on --a9; a million tokens, --a6, cost 592 MB). css-variables lets an engine
     treat a variable that is too long as invalid at computed-value time
     (https://drafts.csswg.org/css-variables/#long-variables), as Chromium does. Expected: #fallback is 120px wide (the
     over-long --a9 takes the fallback), #unset keeps margin-left 0 (no fallback: the declaration is invalid, so
     unset), and the renderer's memory stays where it was. twidget caps a declaration at 16,384 tokens after
     substitution; a custom property past it has the guaranteed-invalid value, and so does one that refers to it
     without a fallback. No canary hits. -->
