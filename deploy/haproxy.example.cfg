# Merge these lines into the EXISTING HTTPS frontend; retain its bind/cert settings.
# Replace telegram.example.com. Do not add another frontend or global section.
# frontend existing_https
#     acl telegram_web_host hdr(host) -i telegram.example.com telegram.example.com:443
#     http-request set-header X-Forwarded-Proto https if telegram_web_host
#     use_backend telegram_web if telegram_web_host

backend telegram_web
    mode http
    option httpchk GET /healthz
    http-check expect status 200
    timeout connect 10s
    timeout server 75s
    timeout tunnel 1h
    server web1 127.0.0.1:8080 check
